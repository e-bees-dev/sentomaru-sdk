# D-17e: exemplo de OpenResty (nginx + lua-nginx-module) na frente do Sentomaru.Gateway.Verifier
# (the Sentomaru gateway verifier contract, seções 5 e 11). Os marcadores em maiúsculas entre sublinhados abaixo são trocados no deploy: endereço e porta
# do ouvinte, do verificador e do upstream. Nenhum segredo: a credencial de workload fica só no verificador.
#
# Por que não `auth_request` puro: o módulo só repassa ao cliente os status 401 e 403 do subpedido, sem o corpo; todo
# outro status não-2xx (400, 409, 413, 422, 429, 5xx) vira 500. O contrato (seção 2) exige o status e o corpo
# {"code": ...} do verificador, então a verificação é um subpedido interno feito pelo Lua (ngx.location.capture), que
# é o `access_by_lua` que a seção 5, item 1, já prevê. O restante do `auth_request` (subpedido interno, corpo lido
# antes, resposta do verificador decide a passagem) é o mesmo desenho.
#
# Modo do chamador, marcador __CALLER_MODE__:
#   jwt             (seção 11) o verificador valida o token: o `authorization` vai a ele e o `www-authenticate` volta ao
#                   cliente. O serviço de autenticação (__AUTHN_*__) não é usado: ponha qualquer endereço.
#   trusted-header  o gateway autentica o usuário num serviço próprio (subpedido interno GET com só o `authorization`) que
#                   responde 200 com `Sentomaru-Caller-Subject` e `Sentomaru-Caller-Tenant` (ou 401/403 com corpo); o
#                   exemplo não valida token nenhum sozinho. O `authorization` NÃO vai ao verificador.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;

  # C1/I4: o verificador e o upstream recebem a MESMA linha de requisição, a crua ($request_uri). O nginx não normaliza
  # o que repassa assim; quem recusa o caminho estranho (segmento ".", "..", "%2E", vazio, "//") é o verificador
  # (403 operation-unmapped / 400 forward-format), e %2F e %5C são recusados aqui, como o Envoy faz.
  merge_slashes off;
  # Nome de cabeçalho com sublinhado é descartado pelo nginx (padrão); explícito para ninguém ligar.
  underscores_in_headers off;
  ignore_invalid_headers on;

  # Corpo inteiro até 65536 bytes na memória do Lua (o buffer cobre o limite; o que o nginx gravar em disco por causa do enquadramento chunked é relido).
  client_max_body_size 65536;
  client_body_buffer_size 64k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  large_client_header_buffers 4 16k;

  # I1: uma verificação, uma execução. Sem nova tentativa para o verificador nem para o upstream.
  upstream verifier { server __VERIFIER_ADDRESS__:__VERIFIER_PORT__ max_fails=0; keepalive 16; }
  upstream authn { server __AUTHN_ADDRESS__:__AUTHN_PORT__ max_fails=0; keepalive 4; }
  upstream app { server __UPSTREAM_ADDRESS__:__UPSTREAM_PORT__ max_fails=0; keepalive 16; }

  # No trusted-header o verificador não recebe o authorization; o Lua marca o subpedido com este cabeçalho interno
  # (apagado do cliente com todo `sentomaru-caller-*`).
  map $http_sentomaru_caller_mode $sentomaru_verifier_authorization {
    default $http_authorization;
    "trusted" "";
  }

  server {
    listen __LISTEN_ADDRESS__:__LISTEN_PORT__;
    set $sentomaru_caller_mode __CALLER_MODE__;

    # 413 do próprio nginx com o corpo JSON do contrato.
    error_page 413 = @body_limit;
    location @body_limit {
      default_type application/json;
      return 413 '{"code":"body-limit"}';
    }

    # Subpedido interno ao verificador. Só a allowlist do extrator (seção 1) e o `authorization` (modo jwt) vão;
    # cookie e sentomaru-caller-* nunca. O método e a linha de requisição são os originais.
    location = /_sentomaru_verify {
      internal;
      # Nomes em minúsculas, como o Envoy os manda (o Kestrel guarda a caixa dos que não conhece e o envelope a leva).
      proxy_pass_request_headers off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_method $request_method;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header content-digest $http_content_digest;
      proxy_set_header signature $http_signature;
      proxy_set_header signature-input $http_signature_input;
      proxy_set_header x-sentomaru-profile $http_x_sentomaru_profile;
      proxy_set_header x-sentomaru-org $http_x_sentomaru_org;
      proxy_set_header x-sentomaru-app $http_x_sentomaru_app;
      proxy_set_header x-sentomaru-environment $http_x_sentomaru_environment;
      proxy_set_header x-sentomaru-session $http_x_sentomaru_session;
      proxy_set_header x-sentomaru-operation $http_x_sentomaru_operation;
      proxy_set_header x-sentomaru-operation-id $http_x_sentomaru_operation_id;
      proxy_set_header x-sentomaru-signals $http_x_sentomaru_signals;
      proxy_set_header Authorization $sentomaru_verifier_authorization;
      proxy_set_header sentomaru-caller-subject $http_sentomaru_caller_subject;
      proxy_set_header sentomaru-caller-tenant $http_sentomaru_caller_tenant;
      proxy_pass_request_body on;
      proxy_connect_timeout 1s;
      proxy_send_timeout 3s;
      proxy_read_timeout 3s;
      proxy_next_upstream off;
      proxy_intercept_errors off;
      proxy_pass http://verifier$request_uri;
    }

    # Serviço de autenticação do gateway (só no trusted-header): sem corpo, só o authorization.
    location = /_sentomaru_authn {
      internal;
      proxy_pass_request_headers off;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_method GET;
      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      proxy_next_upstream off;
      proxy_pass http://authn/;
    }

    location / {
      # Tudo abaixo roda antes de qualquer verificação e antes do access: a ordem é a do contrato (seção 3).
      rewrite_by_lua_block {
        local limit = 65536
        local function reply(status, body, headers)
          ngx.status = status
          ngx.header["Content-Type"] = "application/json"
          for k, v in pairs(headers or {}) do ngx.header[k] = v end
          ngx.print(body)
          return ngx.exit(status)
        end

        -- Apagar o que o cliente não pode mandar: resultado do verificador e chamador do gateway.
        -- I7: cabeçalho do perfil repetido é recusado (400 header-repeated) antes do verificador.
        local single = { ["signature"] = true, ["signature-input"] = true, ["content-type"] = true,
                         ["content-digest"] = true, ["content-length"] = true }
        local seen_repeated = false
        -- Sem o modo "raw": só assim "Signature" e "signature" caem na mesma chave (tabela) e contam como repetidos (achado do E2E de 6/11).
        for name, value in pairs(ngx.req.get_headers(0)) do
          local key = string.lower(name)
          if string.sub(key, 1, 19) == "sentomaru-verified-" or string.sub(key, 1, 17) == "sentomaru-caller-" then
            ngx.req.clear_header(name)
          elseif (single[key] or string.sub(key, 1, 12) == "x-sentomaru-") and type(value) == "table" then
            seen_repeated = true
          end
        end
        if seen_repeated then return reply(400, '{"code":"header-repeated"}') end

        -- Isenção (C1): só GET /health, pela linha crua; o resto é verificado (POST /health dá 403 do verificador).
        local uri = ngx.var.request_uri
        local path = string.match(uri, "^[^?]*")
        if ngx.req.get_method() == "GET" and path == "/health" then return end

        -- C1/I4: %2F e %5C no caminho são recusados antes de qualquer outra coisa (o Envoy: REJECT_REQUEST).
        local lower = string.lower(path)
        if string.find(lower, "%2f", 1, true) or string.find(lower, "%5c", 1, true) then
          return reply(400, '{"code":"forward-format"}')
        end

        -- Chamador (trusted-header): o serviço do gateway autentica; sem 200 com os dois valores o verificador responde
        -- 403 caller-context-missing. Recusa do serviço (4xx) volta como veio; falha dele é 503.
        if ngx.var.sentomaru_caller_mode == "trusted-header" then
          local who = ngx.location.capture("/_sentomaru_authn")
          if not who or who.truncated then return reply(503, '{"code":"integrity-unavailable"}') end
          if who.status ~= 200 then
            if who.status < 400 or who.status >= 500 then return reply(503, '{"code":"integrity-unavailable"}') end
            ngx.status = who.status
            local ctype = who.header["Content-Type"]
            if type(ctype) == "string" then ngx.header["Content-Type"] = ctype end
            local challenge = who.header["WWW-Authenticate"]
            if type(challenge) == "string" then ngx.header["WWW-Authenticate"] = challenge end
            ngx.print(who.body)
            return ngx.exit(who.status)
          end
          local subject, tenant = who.header["Sentomaru-Caller-Subject"], who.header["Sentomaru-Caller-Tenant"]
          if type(subject) == "string" then ngx.req.set_header("Sentomaru-Caller-Subject", subject) end
          if type(tenant) == "string" then ngx.req.set_header("Sentomaru-Caller-Tenant", tenant) end
          ngx.req.set_header("Sentomaru-Caller-Mode", "trusted")
        end

        -- Corpo inteiro na memória (o nginx já recusa acima de client_max_body_size com 413).
        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        -- Um corpo chunked com pedaços pequenos gasta o buffer com o enquadramento e o nginx o grava em disco mesmo abaixo do
        -- limite (achado B20: 65536 bytes em pedaços de até 256 davam 503). Lê-se o arquivo (no máximo limit + 1 bytes);
        -- se não abrir, falha fechado.
        local spilled = ngx.req.get_body_file()
        if spilled then
          local handle = io.open(spilled, "rb")
          if not handle then return reply(503, '{"code":"integrity-unavailable"}') end
          body = handle:read(limit + 1) or ""
          handle:close()
        end
        if body and #body > limit then return reply(413, '{"code":"body-limit"}') end

        -- Como o ext_authz do Envoy: o verificador vê o Content-Length do corpo inteiro lido (também no chunked).
        if body then ngx.req.set_header("Content-Length", tostring(#body)) end
        local opts = { method = ngx.HTTP_POST }
        if body then opts.body = body end
        local res = ngx.location.capture("/_sentomaru_verify", opts)

        -- Verificador fora, lento, com 5xx ou com status fora do contrato: 503 do gateway, nunca passa.
        if not res or res.truncated then return reply(503, '{"code":"integrity-unavailable"}') end
        if res.status ~= 200 then
          if res.status < 400 or res.status >= 500 then return reply(503, '{"code":"integrity-unavailable"}') end
          -- 4xx do verificador: status, tipo e corpo como vieram (e o WWW-Authenticate do modo jwt).
          ngx.status = res.status
          local ctype = res.header["Content-Type"]
          if type(ctype) == "string" then ngx.header["Content-Type"] = ctype end
          local challenge = res.header["WWW-Authenticate"]
          if type(challenge) == "string" then ngx.header["WWW-Authenticate"] = challenge end
          ngx.print(res.body)
          return ngx.exit(res.status)
        end

        -- 200: ao upstream só os sentomaru-verified-* do contrato (seção 3), um valor cada.
        local allowed = {
          ["sentomaru-verified-subject"] = true, ["sentomaru-verified-tenant"] = true,
          ["sentomaru-verified-installation"] = true, ["sentomaru-verified-session"] = true,
          ["sentomaru-verified-verdict"] = true, ["sentomaru-verified-policy-status"] = true,
          ["sentomaru-verified-operation-id"] = true, ["sentomaru-verified-first-admission"] = true,
          ["sentomaru-verified-observed"] = true,
        }
        for name, value in pairs(res.header) do
          local key = string.lower(string.gsub(name, "_", "-"))
          if string.sub(key, 1, 19) == "sentomaru-verified-" then
            if not allowed[key] or type(value) ~= "string" then
              return reply(503, '{"code":"integrity-unavailable"}')
            end
            ngx.req.set_header(key, value)
          end
        end
        ngx.req.clear_header("Sentomaru-Caller-Mode")  -- marca interna: nunca vai ao upstream
      }

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_next_upstream off;
      proxy_connect_timeout 1s;
      proxy_read_timeout 15s;
      proxy_pass http://app$request_uri;
    }
  }
}
