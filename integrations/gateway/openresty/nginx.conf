# D-17e (RASCUNHO, não provado): OpenResty na frente do Sentomaru.Gateway.Verifier, equivalente ao exemplo Envoy
# (integrations/gateway/envoy/envoy.yaml; contrato the Sentomaru gateway verifier contract, seção 5). Nenhum nginx/OpenResty rodou
# este arquivo: ele só passa por the vendor's test openresty example check (checagem textual dos requisitos). Os
# marcadores de endereço e porta são trocados no deploy. Nenhum segredo: a credencial de workload fica só no verificador.
# Por que access_by_lua e não auth_request: o subrequest do auth_request não leva o corpo da requisição de forma
# confiável, e o verificador precisa do corpo inteiro (até 65536 bytes) para conferir o Content-Digest.
worker_processes auto;
events { worker_connections 1024; }
http {
  # Requisito 4/8: nome de cabeçalho com sublinhado ou inválido é recusado (padrões do nginx, escritos para não depender deles).
  underscores_in_headers off;
  ignore_invalid_headers on;
  # Requisito 2: caminho normalizado ($uri) e barras duplas fundidas; %2F e %5C recusados abaixo, antes de qualquer outra coisa.
  merge_slashes on;
  # Requisito 5: corpo inteiro até 65536 bytes, em memória (um buffer só); acima disso, 413 com o corpo JSON do contrato.
  client_max_body_size 64k;
  client_body_buffer_size 64k;
  proxy_request_buffering on;
  lua_need_request_body off;   # lido sob demanda no access_by_lua, uma vez
  error_page 413 = @body_limit;
  # %2F e %5C no caminho cru (qualquer caixa) mudariam o que gateway, verificador e upstream enxergam: 400.
  map $request_uri $escaped_slash { default 0; "~*%2f" 1; "~*%5c" 1; }
  upstream verifier { server __VERIFIER_ADDRESS__:__VERIFIER_PORT__; keepalive 16; }
  upstream app      { server __UPSTREAM_ADDRESS__:__UPSTREAM_PORT__; keepalive 16; }
  server {
    listen __LISTEN_ADDRESS__:__LISTEN_PORT__;
    # Requisito 1: o vhost inteiro é verificado; só GET /health é isenta (repetida em "exempt" na configuração do verificador).
    location = /health {
      limit_except GET { deny all; }   # outro método em /health não é isento: cai em "/" abaixo
      proxy_pass http://app$uri$is_args$args;
      proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location / {
      if ($escaped_slash) { return 400 '{"code":"route-format"}'; }
      default_type application/json;
      # Requisito 6 (cabeçalhos): o cliente nunca fala com o upstream por sentomaru-verified-* nem por sentomaru-caller-*.
      # A remoção e a recusa de repetidos (I7) estão no bloco Lua; o upstream só recebe os valores do verificador.
      access_by_lua_block {
        local json_error = function(status, code)
          ngx.status = status
          ngx.header["Content-Type"] = "application/json"
          ngx.say('{"code":"' .. code .. '"}')
          return ngx.exit(status)
        end
        -- I7: cabeçalhos do perfil repetidos (ou com vírgula em content-type/content-length) → 400 header-repeated.
        local single = { ["signature"]=true, ["signature-input"]=true, ["content-type"]=true, ["content-digest"]=true, ["content-length"]=true }
        local headers = ngx.req.get_headers(0, true)
        for name, value in pairs(headers) do
          local key = string.lower(name)
          if type(value) == "table" then
            if single[key] or key:sub(1, 12) == "x-sentomaru-" then return json_error(400, "header-repeated") end
          elseif (key == "content-type" or key == "content-length") and value:find(",", 1, true) then
            return json_error(400, "header-repeated")
          end
          -- Resultado e chamador mandados pelo cliente nunca valem.
          if key:sub(1, 19) == "sentomaru-verified-" or key:sub(1, 17) == "sentomaru-caller-" then
            ngx.req.clear_header(name)
          end
        end
        -- Chamador (trusted-header): AQUI o gateway autentica o usuário e injeta sentomaru-caller-subject/-tenant
        -- (troque pelo que o gateway já faz; ordem: apagar, autenticar, injetar). No modo jwt do verificador, nada a injetar.
        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        -- Corpo que não coube no buffer (foi para arquivo) não é verificável por inteiro: 413, nunca passa.
        if body == nil and (tonumber(ngx.var.http_content_length) or 0) > 0 then return json_error(413, "body-limit") end
        body = body or ""
        local forward = { ["content-type"]=true, ["content-digest"]=true, ["signature"]=true, ["signature-input"]=true }
        local send = {}
        for name, value in pairs(ngx.req.get_headers(0, true)) do
          local key = string.lower(name)
          if forward[key] or key:sub(1, 12) == "x-sentomaru-" or key:sub(1, 17) == "sentomaru-caller-" then send[name] = value end
        end
        -- Método, caminho normalizado e query: como o upstream vai vê-los (I4). Sem authorization nem cookie (nunca vão ao verificador).
        local httpc = require("resty.http").new()
        httpc:set_timeout(3000)   -- acima do timeoutMs do verificador (2000 ms); sem retry
        local res = httpc:request_uri("http://__VERIFIER_ADDRESS__:__VERIFIER_PORT__" .. ngx.var.uri .. (ngx.var.is_args or "") .. (ngx.var.args or ""), {
          method = ngx.req.get_method(), headers = send, body = body, keepalive = true })
        -- Falha fechada. Verificador fora, lento ou com 5xx: 503 integrity-unavailable, nunca passa.
        if not res or res.status >= 500 then return json_error(503, "integrity-unavailable") end
        if res.status ~= 200 then
          ngx.status = res.status
          ngx.header["Content-Type"] = res.headers["Content-Type"] or "application/json"
          local challenge = res.headers["WWW-Authenticate"]
          if challenge then ngx.header["WWW-Authenticate"] = challenge end
          ngx.print(res.body)
          return ngx.exit(res.status)
        end
        for name, value in pairs(res.headers) do
          if string.lower(name):sub(1, 19) == "sentomaru-verified-" then ngx.req.set_header(name, value) end
        end
      }
      # Requisito 3 (I1): uma verificação, uma execução. Sem retry, sem espelho.
      proxy_next_upstream off;
      proxy_next_upstream_tries 1;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_read_timeout 15s;
      proxy_pass http://app$uri$is_args$args;
    }
    location @body_limit { default_type application/json; return 413 '{"code":"body-limit"}'; }
  }
}
