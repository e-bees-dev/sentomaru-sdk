name: sentomaru_flutter_sample
description: "Synthetic Flutter lab app for Sentomaru SDK."
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  sentomaru_flutter:
    path: ../
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # D-14b: what `asset-encryption` would seal in this sample (lib/d14b_sealed_sample.dart reads them through the plugin;
  # without the CLI, only in debug, through the plain fallback).
  assets:
    - assets/d14b/catalogo.json
    - assets/d14b/sentomaru-strings.json
